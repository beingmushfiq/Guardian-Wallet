<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9f26b" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="30" y1="30" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#c9f26b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="#07090c" />
  <circle cx="50" cy="50" r="42" stroke="rgba(201, 242, 107, 0.25)" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- Main Crystalline Shield -->
  <path
    d="M50 16 L78 27 C78 52 65 72 50 82 C35 72 22 52 22 27 Z"
    fill="#0b1118"
    stroke="url(#shieldGrad)"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Central Polyhedron -->
  <polygon
    points="50,33 62,41 62,56 50,64 38,56 38,41"
    fill="url(#coreGrad)"
  />

  <!-- Precision Checkmark Core -->
  <path
    d="M44 49 L48 53 L57 44"
    stroke="#064e3b"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
