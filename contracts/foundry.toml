[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Pinned local compiler avoids the sandbox-blocked ~/.svm download directory.
solc = "bin/solc.exe"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
base_sepolia = "${RPC_URL}"
