<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9f26b" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="30" y1="30" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#c9f26b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(201, 242, 107, 0.4)" />
      <stop offset="70%" stop-color="rgba(16, 185, 129, 0.1)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="46" fill="url(#ambientGlow)" />

  <!-- Outer Orbital Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#shieldGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="50" cy="50" r="47" stroke="rgba(201, 242, 107, 0.2)" stroke-width="1" />

  <!-- Orbiting Nodes -->
  <circle cx="50" cy="8" r="2.5" fill="#c9f26b" filter="url(#neonBloom)" />
  <circle cx="92" cy="50" r="2" fill="#7ee7c0" />
  <circle cx="8" cy="50" r="2" fill="#7ee7c0" />

  <!-- Main Crystalline Shield -->
  <path
    d="M50 14 L82 26 C82 54 68 76 50 86 C32 76 18 54 18 26 Z"
    fill="#080e14"
    stroke="url(#shieldGrad)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Inner Geometric Facets -->
  <path
    d="M50 20 L76 30 C76 52 64 71 50 80 C36 71 24 52 24 30 Z"
    fill="rgba(16, 185, 129, 0.08)"
    stroke="rgba(201, 242, 107, 0.3)"
    stroke-width="1"
  />

  <!-- Central Cryptographic Core Polyhedron -->
  <polygon
    points="50,32 63,41 63,57 50,66 37,57 37,41"
    fill="url(#coreGrad)"
    opacity="0.9"
    filter="url(#neonBloom)"
  />

  <!-- Core Facet Lines -->
  <line x1="50" y1="32" x2="50" y2="66" stroke="#064e3b" stroke-width="1.2" opacity="0.8" />
  <line x1="50" y1="49" x2="63" y2="41" stroke="#064e3b" stroke-width="1" opacity="0.8" />
  <line x1="50" y1="49" x2="37" y2="41" stroke="#064e3b" stroke-width="1" opacity="0.8" />
  <line x1="50" y1="49" x2="63" y2="57" stroke="#064e3b" stroke-width="1" opacity="0.8" />
  <line x1="50" y1="49" x2="37" y2="57" stroke="#064e3b" stroke-width="1" opacity="0.8" />

  <!-- Precision Checkmark Core -->
  <path
    d="M44 49 L48 53 L57 44"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
